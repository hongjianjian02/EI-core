plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = '1.0.1'
group = 'com.mysterious'

base {
    archivesName = 'EI core'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.265'

    mods {
        mysterious {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.theillusivec4.top/') }
}

dependencies {
    compileOnly files('libs/curios.jar')
    compileOnly files('libs/twilightforest.jar') 
    compileOnly files('libs/draconicevolution.jar')
    compileOnly files('libs/brandonscore.jar')
    implementation files('libs/geckolib.jar')
    compileOnly files('libs/botania.jar', 'libs/ftbquests.jar', 'libs/ftblibrary.jar', 'libs/ftbteams.jar', 'libs/architectury.jar')
    compileOnly files('libs/jade.jar')
    compileOnly files('libs/solcarrot.jar', 'libs/solapplepie.jar')
    compileOnly files('libs/sophisticatedcore.jar', 'libs/sophisticatedbackpacks.jar', 'libs/sophisticatedstorage.jar', 'libs/ftbchunks.jar')
}
